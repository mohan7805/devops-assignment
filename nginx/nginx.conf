# Local stand-in for the AWS Application Load Balancer.
#
# `proxy_pass` is given a variable so nginx re-resolves the `api` service name
# through Docker's embedded DNS at request time. That means
# `docker compose up --scale api=N` is load-balanced (round-robin) without any
# change to this file, and replacing a replica does not require an nginx reload.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $upstream_api api:8080;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Mirrors the ALB target-group health check.
    location = /health {
        set $upstream_health api:8080;
        proxy_pass http://$upstream_health/health;
        access_log off;
    }
}
