name: Terraform

# Infrastructure pipeline: validate + plan on pull requests, manual dispatch for apply.
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'terraform/**'
  #     - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      run_trivy_scan:
        description: 'Run Trivy IaC security scan (uncheck to skip)'
        type: boolean
        default: true

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  TF_VERSION: '1.9.8'
  WORKDIR: terraform/envs/prod

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Format, validate and scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform/

      # Validation without a backend, so it runs on forks with no credentials.
      - name: terraform validate
        run: |
          set -euo pipefail
          for dir in terraform/envs/prod terraform/bootstrap; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

      # Static analysis of the IaC itself. Fails on HIGH/CRITICAL misconfigs.
      - name: Trivy IaC scan
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_trivy_scan != false }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          # Each suppression in this file carries a written justification.
          trivyignores: .trivyignore

  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # All credentials and backend coordinates come from GitHub Secrets.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Auto-bootstrap Remote State (S3 & DynamoDB via Terraform)
        id: bootstrap
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET_NAME="devops-tfstate-${ACCOUNT_ID}"
          LOCK_TABLE="devops-assignment-tf-locks"

          echo "Target State Bucket: ${BUCKET_NAME}"
          echo "Target Lock Table:   ${LOCK_TABLE}"

          if aws s3api head-bucket --bucket "${BUCKET_NAME}" 2>/dev/null; then
            echo "State bucket ${BUCKET_NAME} already exists. Skipping bootstrap."
          else
            echo "State bucket does not exist. Bootstrapping infrastructure via terraform/bootstrap..."
            terraform -chdir=terraform/bootstrap init
            terraform -chdir=terraform/bootstrap apply -auto-approve -input=false \
              -var="owner=${{ vars.OWNER || 'mohan' }}" \
              -var="state_bucket_name=${BUCKET_NAME}" \
              -var="lock_table_name=${LOCK_TABLE}" \
              -var="aws_region=${AWS_REGION}"
            echo "Bootstrap completed successfully. Waiting for S3 propagation..."
            sleep 5
          fi

          echo "bucket=${BUCKET_NAME}" >> "$GITHUB_OUTPUT"
          echo "table=${LOCK_TABLE}" >> "$GITHUB_OUTPUT"

      - name: terraform init (S3 backend + DynamoDB lock)
        run: |
          terraform -chdir="${WORKDIR}" init -input=false \
            -backend-config="bucket=${{ steps.bootstrap.outputs.bucket }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.table }}"

      - name: Release stale lock if present
        run: |
          terraform -chdir="${WORKDIR}" force-unlock -force 46b5894a-f9e1-f85c-daa2-4efbcc1486a8 || true

      - name: terraform plan
        run: |
          terraform -chdir="${WORKDIR}" plan -input=false -lock=false -out=tfplan \
            -var="owner=${{ vars.OWNER || 'mohan' }}" \
            -var="alarm_email=${{ secrets.ALARM_EMAIL || 'mohanmadhavan7805@gmail.com' }}" \
            -var="aws_region=${AWS_REGION}"

      - name: Render the plan
        run: terraform -chdir="${WORKDIR}" show -no-color tfplan | tee /tmp/plan.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.WORKDIR }}/tfplan
            /tmp/plan.txt
          retention-days: 7

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: production-infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Auto-bootstrap Remote State (S3 & DynamoDB via Terraform)
        id: bootstrap
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET_NAME="devops-tfstate-${ACCOUNT_ID}"
          LOCK_TABLE="devops-assignment-tf-locks"

          echo "Target State Bucket: ${BUCKET_NAME}"
          echo "Target Lock Table:   ${LOCK_TABLE}"

          if aws s3api head-bucket --bucket "${BUCKET_NAME}" 2>/dev/null; then
            echo "State bucket ${BUCKET_NAME} already exists. Skipping bootstrap."
          else
            echo "State bucket does not exist. Bootstrapping infrastructure via terraform/bootstrap..."
            terraform -chdir=terraform/bootstrap init
            terraform -chdir=terraform/bootstrap apply -auto-approve -input=false \
              -var="owner=${{ vars.OWNER || 'mohan' }}" \
              -var="state_bucket_name=${BUCKET_NAME}" \
              -var="lock_table_name=${LOCK_TABLE}" \
              -var="aws_region=${AWS_REGION}"
            echo "Bootstrap completed successfully. Waiting for S3 propagation..."
            sleep 5
          fi

          echo "bucket=${BUCKET_NAME}" >> "$GITHUB_OUTPUT"
          echo "table=${LOCK_TABLE}" >> "$GITHUB_OUTPUT"

      - name: terraform init
        run: |
          terraform -chdir="${WORKDIR}" init -input=false \
            -backend-config="bucket=${{ steps.bootstrap.outputs.bucket }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.table }}"

      - name: Release stale lock if present
        run: |
          terraform -chdir="${WORKDIR}" force-unlock -force 46b5894a-f9e1-f85c-daa2-4efbcc1486a8 || true

      - name: terraform apply
        run: |
          terraform -chdir="${WORKDIR}" apply -input=false -auto-approve -lock=false \
            -var="owner=${{ vars.OWNER || 'mohan' }}" \
            -var="alarm_email=${{ secrets.ALARM_EMAIL || 'mohanmadhavan7805@gmail.com' }}" \
            -var="aws_region=${AWS_REGION}"

      - name: Publish the stack outputs
        run: |
          {
            echo "### Infrastructure outputs"
            echo ""
            echo '```'
            terraform -chdir="${WORKDIR}" output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
