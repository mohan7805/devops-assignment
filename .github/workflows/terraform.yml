name: Terraform

# Infrastructure pipeline: validate + plan on pull requests, manual dispatch for apply.
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'terraform/**'
  #     - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      run_trivy_scan:
        description: 'Run Trivy IaC security scan (uncheck to skip)'
        type: boolean
        default: true

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  TF_VERSION: '1.9.8'
  WORKDIR: terraform/envs/prod

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Format, validate and scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform/

      # Validation without a backend, so it runs on forks with no credentials.
      - name: terraform validate
        run: |
          set -euo pipefail
          for dir in terraform/envs/prod terraform/bootstrap; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

      # Static analysis of the IaC itself. Fails on HIGH/CRITICAL misconfigs.
      - name: Trivy IaC scan
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_trivy_scan != false }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          # Each suppression in this file carries a written justification.
          trivyignores: .trivyignore

  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # All credentials and backend coordinates come from GitHub Secrets.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Ensure S3 backend and DynamoDB lock table exist (Auto-Bootstrap)
        id: bootstrap
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          PREFERRED="devops-mohan"
          REGION="${AWS_REGION}"

          # 1. Determine or create S3 bucket
          if aws s3api head-bucket --bucket "${PREFERRED}" 2>/dev/null; then
            BUCKET="${PREFERRED}"
            echo "Using existing bucket: ${BUCKET}"
          else
            echo "Checking S3 bucket: ${PREFERRED}..."
            if [ "${REGION}" = "us-east-1" ]; then
              CREATE_ERR="$(aws s3api create-bucket --bucket "${PREFERRED}" --region "${REGION}" 2>&1 || true)"
            else
              CREATE_ERR="$(aws s3api create-bucket --bucket "${PREFERRED}" --region "${REGION}" --create-bucket-configuration LocationConstraint="${REGION}" 2>&1 || true)"
            fi

            if aws s3api head-bucket --bucket "${PREFERRED}" 2>/dev/null; then
              BUCKET="${PREFERRED}"
              echo "Successfully created: ${BUCKET}"
            else
              BUCKET="devops-mohan-${ACCOUNT_ID}"
              echo "${PREFERRED} unavailable (${CREATE_ERR}). Using unique bucket: ${BUCKET}..."
              if ! aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
                if [ "${REGION}" = "us-east-1" ]; then
                  aws s3api create-bucket --bucket "${BUCKET}" --region "${REGION}"
                else
                  aws s3api create-bucket --bucket "${BUCKET}" --region "${REGION}" --create-bucket-configuration LocationConstraint="${REGION}"
                fi
              fi
            fi

            echo "Configuring versioning and encryption on ${BUCKET}..."
            aws s3api put-bucket-versioning --bucket "${BUCKET}" --versioning-configuration Status=Enabled || true
            aws s3api put-bucket-encryption --bucket "${BUCKET}" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}' || true
            aws s3api put-public-access-block --bucket "${BUCKET}" --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true" || true
          fi

          # 2. Ensure DynamoDB lock table exists
          LOCK_TABLE="devops-assignment-tf-locks"
          if ! aws dynamodb describe-table --table-name "${LOCK_TABLE}" --region "${REGION}" >/dev/null 2>&1; then
            echo "Creating DynamoDB table: ${LOCK_TABLE}..."
            aws dynamodb create-table \
              --table-name "${LOCK_TABLE}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${REGION}"
            echo "Waiting for DynamoDB table to become ACTIVE..."
            aws dynamodb wait table-exists --table-name "${LOCK_TABLE}" --region "${REGION}"
            echo "DynamoDB table ACTIVE."
          else
            echo "DynamoDB table ${LOCK_TABLE} already exists."
          fi

          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "table=${LOCK_TABLE}" >> "$GITHUB_OUTPUT"

      - name: terraform init (S3 backend + DynamoDB lock)
        run: |
          terraform -chdir="${WORKDIR}" init -input=false \
            -backend-config="bucket=${{ steps.bootstrap.outputs.bucket }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.table }}"

      - name: terraform plan
        run: |
          terraform -chdir="${WORKDIR}" plan -input=false -lock-timeout=5m -out=tfplan \
            -var="owner=${{ vars.OWNER || 'mohan' }}" \
            -var="alarm_email=${{ secrets.ALARM_EMAIL || 'mohanmadhavan7805@gmail.com' }}" \
            -var="aws_region=${AWS_REGION}"

      - name: Render the plan
        run: terraform -chdir="${WORKDIR}" show -no-color tfplan | tee /tmp/plan.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.WORKDIR }}/tfplan
            /tmp/plan.txt
          retention-days: 7

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: production-infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Ensure S3 backend and DynamoDB lock table exist (Auto-Bootstrap)
        id: bootstrap
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          PREFERRED="devops-mohan"
          REGION="${AWS_REGION}"

          # 1. Determine or create S3 bucket
          if aws s3api head-bucket --bucket "${PREFERRED}" 2>/dev/null; then
            BUCKET="${PREFERRED}"
            echo "Using existing bucket: ${BUCKET}"
          else
            echo "Checking S3 bucket: ${PREFERRED}..."
            if [ "${REGION}" = "us-east-1" ]; then
              CREATE_ERR="$(aws s3api create-bucket --bucket "${PREFERRED}" --region "${REGION}" 2>&1 || true)"
            else
              CREATE_ERR="$(aws s3api create-bucket --bucket "${PREFERRED}" --region "${REGION}" --create-bucket-configuration LocationConstraint="${REGION}" 2>&1 || true)"
            fi

            if aws s3api head-bucket --bucket "${PREFERRED}" 2>/dev/null; then
              BUCKET="${PREFERRED}"
              echo "Successfully created: ${BUCKET}"
            else
              BUCKET="devops-mohan-${ACCOUNT_ID}"
              echo "${PREFERRED} unavailable (${CREATE_ERR}). Using unique bucket: ${BUCKET}..."
              if ! aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
                if [ "${REGION}" = "us-east-1" ]; then
                  aws s3api create-bucket --bucket "${BUCKET}" --region "${REGION}"
                else
                  aws s3api create-bucket --bucket "${BUCKET}" --region "${REGION}" --create-bucket-configuration LocationConstraint="${REGION}"
                fi
              fi
            fi

            echo "Configuring versioning and encryption on ${BUCKET}..."
            aws s3api put-bucket-versioning --bucket "${BUCKET}" --versioning-configuration Status=Enabled || true
            aws s3api put-bucket-encryption --bucket "${BUCKET}" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}' || true
            aws s3api put-public-access-block --bucket "${BUCKET}" --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true" || true
          fi

          # 2. Ensure DynamoDB lock table exists
          LOCK_TABLE="devops-assignment-tf-locks"
          if ! aws dynamodb describe-table --table-name "${LOCK_TABLE}" --region "${REGION}" >/dev/null 2>&1; then
            echo "Creating DynamoDB table: ${LOCK_TABLE}..."
            aws dynamodb create-table \
              --table-name "${LOCK_TABLE}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${REGION}"
            echo "Waiting for DynamoDB table to become ACTIVE..."
            aws dynamodb wait table-exists --table-name "${LOCK_TABLE}" --region "${REGION}"
            echo "DynamoDB table ACTIVE."
          else
            echo "DynamoDB table ${LOCK_TABLE} already exists."
          fi

          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "table=${LOCK_TABLE}" >> "$GITHUB_OUTPUT"

      - name: terraform init
        run: |
          terraform -chdir="${WORKDIR}" init -input=false \
            -backend-config="bucket=${{ steps.bootstrap.outputs.bucket }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.table }}"

      - name: terraform apply
        run: |
          terraform -chdir="${WORKDIR}" apply -input=false -auto-approve -lock-timeout=5m \
            -var="owner=${{ vars.OWNER || 'mohan' }}" \
            -var="alarm_email=${{ secrets.ALARM_EMAIL || 'mohanmadhavan7805@gmail.com' }}" \
            -var="aws_region=${AWS_REGION}"

      - name: Publish the stack outputs
        run: |
          {
            echo "### Infrastructure outputs"
            echo ""
            echo '```'
            terraform -chdir="${WORKDIR}" output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
