name: Trivy Security Scan
run-name: Trivy Scan (${{ inputs.scan_target || 'manual' }})

on:
  workflow_dispatch:
    inputs:
      scan_target:
        description: 'Scan Target'
        required: true
        type: choice
        options:
          - image
          - repo
          - terraform
          - all
        default: 'image'
      severity:
        description: 'Vulnerability Severity Levels'
        required: true
        type: choice
        options:
          - 'HIGH,CRITICAL'
          - 'CRITICAL'
          - 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
        default: 'HIGH,CRITICAL'
      fail_on_vulnerabilities:
        description: 'Fail workflow if vulnerabilities/misconfigs are found'
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

env:
  PROJECT: ${{ vars.PROJECT || 'devops-assignment' }}
  APP_VERSION: ${{ vars.APP_VERSION || '1.0.0' }}

jobs:
  trivy-scan:
    name: Trivy Scan (${{ inputs.scan_target }})
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # TARGET: Docker Image
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        if: ${{ inputs.scan_target == 'image' || inputs.scan_target == 'all' }}
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        if: ${{ inputs.scan_target == 'image' || inputs.scan_target == 'all' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: ${{ env.PROJECT }}:scan
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=scan

      - name: Scan Docker Image (Table)
        if: ${{ inputs.scan_target == 'image' || inputs.scan_target == 'all' }}
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.PROJECT }}:scan
          format: table
          severity: ${{ inputs.severity }}
          ignore-unfixed: false
          vuln-type: 'os,library'
          exit-code: ${{ inputs.fail_on_vulnerabilities && '1' || '0' }}
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2

      - name: Scan Docker Image (SARIF Report)
        if: ${{ (inputs.scan_target == 'image' || inputs.scan_target == 'all') && !cancelled() }}
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.PROJECT }}:scan
          format: sarif
          output: trivy-image-results.sarif
          severity: ${{ inputs.severity }}
          exit-code: '0'

      # -----------------------------------------------------------------------
      # TARGET: Source Code / Dependencies (Filesystem)
      # -----------------------------------------------------------------------
      - name: Scan Source Code & Dependencies
        if: ${{ inputs.scan_target == 'repo' || inputs.scan_target == 'all' }}
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: table
          severity: ${{ inputs.severity }}
          exit-code: ${{ inputs.fail_on_vulnerabilities && '1' || '0' }}
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2

      - name: Scan Source Code (SARIF Report)
        if: ${{ (inputs.scan_target == 'repo' || inputs.scan_target == 'all') && !cancelled() }}
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: sarif
          output: trivy-repo-results.sarif
          severity: ${{ inputs.severity }}
          exit-code: '0'

      # -----------------------------------------------------------------------
      # TARGET: Terraform IaC Misconfigurations
      # -----------------------------------------------------------------------
      - name: Scan Terraform IaC Misconfigurations
        if: ${{ inputs.scan_target == 'terraform' || inputs.scan_target == 'all' }}
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: table
          severity: ${{ inputs.severity }}
          trivyignores: .trivyignore
          exit-code: ${{ inputs.fail_on_vulnerabilities && '1' || '0' }}

      - name: Scan Terraform IaC (SARIF Report)
        if: ${{ (inputs.scan_target == 'terraform' || inputs.scan_target == 'all') && !cancelled() }}
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: sarif
          output: trivy-tf-results.sarif
          severity: ${{ inputs.severity }}
          trivyignores: .trivyignore
          exit-code: '0'

      # -----------------------------------------------------------------------
      # Upload Reports Artifact
      # -----------------------------------------------------------------------
      - name: Upload Scan Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-reports
          path: trivy-*.sarif
          retention-days: 14
          if-no-files-found: ignore
