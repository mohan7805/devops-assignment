name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm deletion of all AWS infrastructure'
        required: true
        type: string
        default: 'destroy'

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  TF_VERSION: '1.9.8'
  WORKDIR: terraform/envs/prod

permissions:
  contents: read

jobs:
  destroy:
    name: Terraform Destroy
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-24.04
    environment:
      name: production-infra
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Get Backend Details
        id: bootstrap
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET_NAME="devops-tfstate-${ACCOUNT_ID}"
          LOCK_TABLE="devops-assignment-tf-locks"

          echo "Target State Bucket: ${BUCKET_NAME}"
          echo "Target Lock Table:   ${LOCK_TABLE}"

          echo "bucket=${BUCKET_NAME}" >> "$GITHUB_OUTPUT"
          echo "table=${LOCK_TABLE}" >> "$GITHUB_OUTPUT"

      - name: Terraform Init
        run: |
          terraform -chdir="${WORKDIR}" init -input=false \
            -backend-config="bucket=${{ steps.bootstrap.outputs.bucket }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.table }}"

      - name: Release DynamoDB lock if present
        continue-on-error: true
        run: |
          aws dynamodb delete-item --table-name "${{ steps.bootstrap.outputs.table }}" --key "{\"LockID\": {\"S\": \"${{ steps.bootstrap.outputs.bucket }}/prod/terraform.tfstate-md5\"}}" 2>/dev/null || true

      - name: Empty ECR images to prevent dependency errors
        run: |
          set +e
          echo "Checking ECR images..."
          IMAGE_IDS=$(aws ecr list-images --repository-name devops-assignment --query 'imageIds[*]' --output json 2>/dev/null)
          if [ "$IMAGE_IDS" != "[]" ] && [ -n "$IMAGE_IDS" ] && [ "$IMAGE_IDS" != "null" ]; then
            echo "Deleting images from ECR repository..."
            aws ecr batch-delete-image --repository-name devops-assignment --image-ids "$IMAGE_IDS" || true
          fi
          set -e

      - name: Terraform Destroy
        run: |
          terraform -chdir="${WORKDIR}" destroy -input=false -auto-approve -lock=false \
            -var="owner=${{ vars.OWNER || 'mohan' }}" \
            -var="alarm_email=${{ secrets.ALARM_EMAIL || 'mohanmadhavan7805@gmail.com' }}" \
            -var="aws_region=${AWS_REGION}" || {
              echo "First pass encountered dependency delay (EC2/ENI terminating). Waiting 60s..."
              sleep 60
              echo "Retrying Terraform Destroy..."
              terraform -chdir="${WORKDIR}" destroy -input=false -auto-approve -lock=false \
                -var="owner=${{ vars.OWNER || 'mohan' }}" \
                -var="alarm_email=${{ secrets.ALARM_EMAIL || 'mohanmadhavan7805@gmail.com' }}" \
                -var="aws_region=${AWS_REGION}"
            }

      - name: Summary
        run: |
          echo "### All AWS production resources have been successfully destroyed!" >> "$GITHUB_STEP_SUMMARY"
