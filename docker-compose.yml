# Local development / demonstration stack.
#
#   docker compose up --build --scale api=2
#
# Brings up two replicas of the API behind an nginx load balancer, which mirrors
# the AWS topology (ALB -> Auto Scaling Group of container hosts) on a laptop.
#
#   curl localhost:8080/health
#   curl localhost:8080/info      # hostname changes between requests
#
# Run the unit tests:
#
#   docker compose --profile test run --rm tests

name: devops-assignment

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-local}
    image: devops-assignment-api:${IMAGE_TAG:-local}
    environment:
      # Every setting is supplied through the environment - no baked-in config.
      PORT: 8080
      APP_VERSION: ${APP_VERSION:-1.0.0}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-local}
      GREETING: ${GREETING:-Hello from docker-compose}
      APP_ENV: local
      ENABLE_CHAOS: ${ENABLE_CHAOS:-false}
      SHUTDOWN_TIMEOUT_MS: 15000
    expose:
      - "8080"
    healthcheck:
      # curl is deliberately not installed in the image; node does the probe.
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s
    # Hardening: the container writes nothing to its filesystem and needs no
    # Linux capabilities. `no-new-privileges` is applied in AWS (see the
    # docker run flags in terraform/modules/compute/user_data.sh.tftpl) but is
    # left out here: on some AppArmor-enabled hosts it makes every exec fail.
    read_only: true
    cap_drop:
      - ALL
    networks:
      - appnet

  lb:
    image: nginx:1.27.2-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${LB_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - appnet

  # Test runner - uses the Dockerfile's `test` stage. Exits non-zero on failure.
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    command: ["npm", "test"]
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
